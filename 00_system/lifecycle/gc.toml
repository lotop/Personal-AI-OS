schema_version = "0.1.0"
artifact_class = "CONFIG"
maturity_state = "APPROVED"
approval_reference = "PAOS-016"
enabled = true
dry_run_only = false
destructive_delete = false
require_immutable_plan = true
plan_ttl_hours = 24
revalidate_before_execute = true
quarantine_excluded_from_scan = true
execution_mode = "QUARANTINE_ONLY"
quarantine_root = "99_temp/quarantine"
plan_root = "99_temp/plans"

[scope]
allowed_names = [".DS_Store", "__pycache__"]
allowed_suffixes = [".pyc"]
allow_99_temp_children = true
protected_99_temp_names = [".gitkeep", "plans", "quarantine"]

[retention]
temp_days = 7
cache_days = 30
logs_days = 30
generated_unreferenced_days = 30

[protection]
classes = ["SOURCE", "RULE", "TEMPLATE", "CONFIG", "REGISTRY", "ARCHIVE"]
maturity_states = ["APPROVED"]
require_reference_scan = true
require_backup = true
require_founder_approval = true
