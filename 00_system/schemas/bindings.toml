schema_version = "0.1.0-working"
artifact_class = "REGISTRY"
maturity_state = "WORKING"

[[bindings]]
path = "SYSTEM.toml"
format = "toml"
schema = "system.schema.json"

[[bindings]]
path = "02_registry/tasks.toml"
format = "toml"
schema = "task-registry.schema.json"

[[bindings]]
path = "02_registry/projects.toml"
format = "toml"
schema = "project-registry.schema.json"

[[bindings]]
path = "02_registry/agents.toml"
format = "toml"
schema = "agent-registry.schema.json"

[[bindings]]
path = "02_registry/skills.toml"
format = "toml"
schema = "skill-registry.schema.json"

[[bindings]]
path = "02_registry/runtimes.toml"
format = "toml"
schema = "runtime-registry.schema.json"

[[bindings]]
path = "02_registry/hooks.toml"
format = "toml"
schema = "hook-registry.schema.json"

[[bindings]]
path_glob = "03_adapters/*/manifest.toml"
format = "toml"
schema = "adapter-manifest.schema.json"

[[bindings]]
path_glob = "01_templates/*/template.toml"
format = "toml"
schema = "template-pack.schema.json"

[[bindings]]
path_glob = "07_working/candidates/*/template.toml"
format = "toml"
schema = "template-pack.schema.json"
