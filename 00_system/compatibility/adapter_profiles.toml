schema_version = "0.1.0-working"
artifact_class = "CONFIG"
maturity_state = "WORKING"

[codex]
platform = "codex"
native_format = "toml"
target = ".codex/config.toml"
status = "CANDIDATE"

[codex.settings]
project_doc_max_bytes = 65536
project_root_markers = [".git", "SYSTEM.toml", "project.toml"]

[gemini_cli]
platform = "gemini-cli"
native_format = "json"
target = ".gemini/settings.json"
status = "CANDIDATE"

[gemini_cli.context]
fileName = ["AGENTS.md"]
loadFromIncludeDirectories = false

[gemini_cli.context.fileFiltering]
respectGitIgnore = true
