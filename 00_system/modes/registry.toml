schema_version = "0.1.0-working"
artifact_state = "WORKING"

[[modes]]
id = "chat"
default_write = "NONE"
task_card_required = false

[[modes]]
id = "work"
default_write = "TASK_WRITE_SET"
task_card_required = true

[[modes]]
id = "review"
default_write = "NONE"
task_card_required = true

[context]
load_order = ["GLOBAL", "MODE", "PROJECT", "TASK", "RELEVANT_KNOWLEDGE"]
manifest_first = true
load_archive_by_default = false
load_other_projects_by_default = false
persist_mode_history = false
