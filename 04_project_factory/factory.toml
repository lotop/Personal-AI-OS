schema_version = "0.2.0"
artifact_state = "APPROVED"
canonical_authority = "FOUNDER_APPROVED"
approval_reference = "PAOS-018"
factory_version = "1.2.0"
dry_run_default = true
require_approved_template_pack = true
default_branch = "main"

# 每个类型对应一份专属约定框架，由 Template Pack 按 primary_types 过滤器产出到
# 目标项目的 00_governance/PROJECT_TYPE_FRAMEWORK.md。新增类型必须同时提供框架文件。
primary_types = [
  "SOFTWARE_DEVELOPMENT",
  "SOLUTION_RESEARCH",
  "CONTENT_MARKETING",
  "BRAND_MANAGEMENT",
]

allowed_overlays = [
  "software",
  "data",
  "ai",
  "security",
  "compliance",
  "content",
  "finance",
  "vendor",
]

# Pack 用途属于 Factory 路由配置，不写入或改动已批准 Template Manifest。
[template_pack_kinds]
paos-project-base = "PROJECT_SCAFFOLD"
paos-core-templates = "ARTIFACT_LIBRARY"

# Digest = SHA-256(sorted(relative_path + NUL + file_sha256 + LF))。
# 该登记位于 Factory 外部，避免改写已批准 Template Manifest。
[approved_template_pack_digests]
paos-project-base = "778fe664e351ec3e4a6ccea01b56e6e5cbc1bcc2f316c8c3e8346899ea006337"
paos-core-templates = "bb5b690fdd4aef1dded0b8d0941b0c97c2a1287dbfdb2beeb09392bfb27b8fd0"
