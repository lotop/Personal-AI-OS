schema_version = "0.1.0-working"
artifact_state = "WORKING"
dry_run_default = true
require_approved_template_pack = true
default_branch = "main"

primary_types = [
  "BUSINESS_VENTURE",
  "SOFTWARE_PRODUCT",
  "RESEARCH_DECISION",
  "OPERATIONS_PROGRAM",
  "CONTENT_BRAND",
]

allowed_overlays = [
  "software",
  "data",
  "ai",
  "security",
  "compliance",
  "content",
  "finance",
  "vendor",
]

# Pack 用途属于 Factory 路由配置，不写入或改动已批准 Template Manifest。
[template_pack_kinds]
paos-project-base = "PROJECT_SCAFFOLD"
paos-core-templates = "ARTIFACT_LIBRARY"
