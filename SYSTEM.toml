hooks_default_enabled = false
destructive_gc_enabled = false
automatic_deploy_enabled = false

[implementation]
physical_architecture = "APPROVED"
project_factory = "APPROVED"
codex_adapter = "GENERATED_WORKING"
gemini_adapter = "GENERATED_WORKING"
deployment = "DRY_RUN_READY"
release = "WORKING"
local_git_recovery = "REVALIDATION_REQUIRED"
offline_bundle_recovery = "REVALIDATION_REQUIRED"
private_remote_recovery = "NOT_TESTED"

[deployment_status]
codex_project_config = "DEPLOYED_WORKING"
codex_runtime_smoke = "PASS_CURRENT_TASK"
gemini_project_config = "DEPLOYED_WORKING"
gemini_runtime_smoke = "NOT_INSTALLED_AND_EXTERNAL_DATA_NOT_AUTHORIZED"
hooks_enabled = false
