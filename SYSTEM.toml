schema_version = "0.4.0-working"
system_name = "Personal AI OS"
target_version = "1.1"
artifact_state = "APPROVED"
canonical_authority = "FOUNDER_APPROVAL"
approval_reference = "PAOS-REL-001"
default_language = "zh-CN"
default_structured_config = "toml"

[repository]
role = "canonical-control-plane-repository"
business_projects_embedded = false
default_branch = "main"
parallel_writes_require_worktree = true

[promotion]
automatic = false
founder_approval_required = true

[automation]
hooks_phase = 1
hooks_default_enabled = false
destructive_gc_enabled = false
automatic_deploy_enabled = false

[implementation]
physical_architecture = "APPROVED"
project_factory = "APPROVED"
codex_adapter = "GENERATED_APPROVED"
gemini_adapter = "GENERATED_APPROVED"
deployment = "DRY_RUN_READY"
release = "PASS"
local_git_recovery = "PASS"
offline_bundle_recovery = "PASS"
private_remote_recovery = "NOT_TESTED"

[deployment_status]
codex_project_config = "DEPLOYED_WORKING"
codex_runtime_smoke = "PASS"
gemini_project_config = "DEPLOYED_WORKING"
gemini_runtime_smoke = "BLOCKED_EXTERNAL_DATA_AUTHORIZATION"
hooks_enabled = false
