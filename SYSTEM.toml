schema_version = "0.4.0-working"
system_name = "Personal AI OS"
target_version = "1.2.2"
artifact_state = "APPROVED"
canonical_authority = "FOUNDER_APPROVED"
default_language = "zh-CN"
default_structured_config = "toml"

[approved_baseline]
version = "1.2.2"
artifact_state = "APPROVED"
canonical_authority = "FOUNDER_APPROVED"
approval_reference = "PAOS-REL-008"
git_tag = "v1.2.2"
# freeze_commit 是实现冻结提交；最终 Release Commit 由 annotated tag 直接绑定。
# v1.2.1 历史：tag 曾由 299f25a 重新指向 15cfee2，冻结点为 c8e3ecc0；见 PAOS-023。
freeze_commit = "0000000000000000000000000000000000000000"

[repository]
role = "canonical-control-plane-repository"
business_projects_embedded = false
default_branch = "main"
parallel_writes_require_worktree = true

[promotion]
automatic = false
founder_approval_required = true

[automation]
hooks_phase = 1
hooks_default_enabled = false
destructive_gc_enabled = false
automatic_deploy_enabled = false

[implementation]
physical_architecture = "APPROVED"
project_factory = "APPROVED"
codex_adapter = "GENERATED_WORKING"
claude_code_adapter = "GENERATED_WORKING"
antigravity_adapter = "GENERATED_WORKING"
deployment = "APPROVED_LOCAL"
release = "APPROVED_LOCAL_TAG_NOT_PUSHED"
local_git_recovery = "PASS_V1.2.2"
offline_bundle_recovery = "PASS_V1.2.2"
private_remote_recovery = "NOT_TESTED"

[deployment_status]
codex_project_config = "DEPLOYED_WORKING"
codex_runtime_smoke = "PASS_CURRENT_TASK"
claude_code_project_config = "DEPLOYED_WORKING"
claude_code_config_load = "PASS_ISOLATED"
claude_code_runtime_smoke = "PASS_CURRENT_TASK"
antigravity_project_config = "DEPLOYED_WORKING"
antigravity_runtime_smoke = "PASS_CURRENT_TASK"
hooks_enabled = false
